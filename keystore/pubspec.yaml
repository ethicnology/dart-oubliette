name: keystore
description: Flutter plugin exposing the Android Keystore (AES-256-GCM) via a typed Dart facade.
version: 1.0.0
publish_to: 'none'
homepage: https://github.com/ethicnology/dart-oubliette
repository: https://github.com/ethicnology/dart-oubliette

environment:
  sdk: ^3.10.4
  flutter: ">=3.3.0"

dependencies:
  flutter:
    sdk: flutter

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  plugin:
    platforms:
      android:
        package: com.oubliette.keystore
        pluginClass: KeystorePlugin

name: secret_service
description: Flutter plugin exposing the freedesktop Secret Service (libsecret) on Linux via a typed Dart facade.
version: 1.0.0
publish_to: 'none'
homepage: https://github.com/ethicnology/dart-oubliette
repository: https://github.com/ethicnology/dart-oubliette

resolution: workspace

environment:
  sdk: "3.12.1"
  flutter: "3.44.1"

dependencies:
  flutter:
    sdk: flutter

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  plugin:
    platforms:
      linux:
        pluginClass: SecretServicePlugin

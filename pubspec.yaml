# Monorepo workspace root (Dart pub workspaces + Melos).
# Not a publishable package — it only ties the three plugin packages and the
# example together into one resolution (a single pubspec.lock, locally-linked
# path deps) and hosts the Melos scripts. Use Dart >= 3.6 (we pin 3.12).
name: oubliette_workspace
publish_to: none

environment:
  # Floor matches the fvm/CI toolchain (Flutter 3.44.1 → Dart 3.12.1); the range
  # lets contributors and CI resolve on any compatible 3.x patch instead of a
  # single exact patch (a bare version is an exact pub constraint and blocks
  # `pub get` off 3.12.1). Reproducibility is provided by the committed
  # pubspec.lock, .fvmrc, and the SHA-pinned Gradle distribution — not the pin.
  sdk: ">=3.12.1 <4.0.0"

workspace:
  - oubliette
  - keystore
  - keychain
  - secret_service
  - oubliette/example

dev_dependencies:
  melos: ^7.0.0

melos:
  scripts:
    # Scripts call melos via `dart run melos` (the dev-dependency) rather than a
    # globally-activated `melos` — a global activation is tied to the SDK it was
    # activated with and breaks when invoked under a different Dart (e.g. fvm vs
    # system). `dart run` always uses the workspace's resolved melos under the
    # ambient Dart, so run with `fvm exec ...` locally (CI's Dart is already 3.12).
    analyze:
      description: Analyze every package (fails on any issue).
      run: dart run melos exec -- flutter analyze
    test:
      description: Run Dart unit tests in every package that has a test/ dir.
      run: dart run melos exec --dir-exists=test -- flutter test
    format:
      description: Check formatting across all packages.
      run: dart run melos exec -- dart format --set-exit-if-changed .
    format:fix:
      description: Apply formatting across all packages.
      run: dart run melos exec -- dart format .

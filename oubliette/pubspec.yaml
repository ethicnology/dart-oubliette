name: oubliette
description: "Cross-platform secure storage for Flutter (Android Keystore, iOS/macOS Keychain, Linux Secret Service)."
version: 1.0.0
homepage: https://github.com/ethicnology/dart-oubliette
repository: https://github.com/ethicnology/dart-oubliette

resolution: workspace

environment:
  sdk: ">=3.12.1 <4.0.0"
  flutter: ">=3.44.1"

dependencies:
  flutter:
    sdk: flutter
  meta: ^1.18.0
  # Sibling workspace members. Plain hosted-style constraints (no `path:`):
  # under Dart pub workspaces these resolve to the local copies for development
  # (a publishable package may not carry `path` deps), and to pub.dev once each
  # sibling is published. Publish the three leaves before `oubliette`.
  keychain: ^1.0.0
  keystore: ^1.0.0
  secret_service: ^1.0.0
  shared_preferences: ^2.5.5
  pointycastle: ^4.0.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  plugin:
    platforms:
      android:
        default_package: keystore
      ios:
        default_package: keychain
      macos:
        default_package: keychain
      linux:
        default_package: secret_service

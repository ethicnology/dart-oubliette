name: oubliette
description: "Cross-platform secure storage for Flutter (Android Keystore, iOS/macOS Keychain)."
version: 1.0.0
publish_to: 'none'
homepage: https://github.com/ethicnology/dart-oubliette
repository: https://github.com/ethicnology/dart-oubliette

resolution: workspace

environment:
  sdk: "3.12.1"
  flutter: "3.44.1"

dependencies:
  flutter:
    sdk: flutter
  meta: ^1.18.0
  keychain:
    path: ../keychain
  keystore:
    path: ../keystore
  shared_preferences: ^2.5.5

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  plugin:
    platforms:
      android:
        default_package: keystore
      ios:
        default_package: keychain
      macos:
        default_package: keychain

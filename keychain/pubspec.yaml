name: keychain
description: Flutter plugin exposing the iOS/macOS Keychain (SecItem API) via a typed Dart facade.
version: 1.0.0
publish_to: 'none'
homepage: https://github.com/ethicnology/dart-oubliette
repository: https://github.com/ethicnology/dart-oubliette

environment:
  sdk: ^3.12.0
  flutter: ">=3.44.0"

dependencies:
  flutter:
    sdk: flutter

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  plugin:
    platforms:
      ios:
        pluginClass: KeychainPlugin
        sharedDarwinSource: true
      macos:
        pluginClass: KeychainPlugin
        sharedDarwinSource: true

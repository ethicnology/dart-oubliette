# Dependency advisory scanning + update PRs. Covers all three ecosystems the
# project ships: pub (Dart/Flutter), Gradle (Android native), and the CI
# actions themselves. Addresses the supply-chain checklist (research C18/C19).
version: 2
updates:
  - package-ecosystem: "pub"
    directories:
      # The workspace root is where the single pubspec.lock and melos resolve;
      # the members are listed so their own constraint files get coverage too.
      - "/"
      - "/oubliette"
      - "/keystore"
      - "/keychain"
      - "/secret_service"
      - "/oubliette/example"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 5

  - package-ecosystem: "gradle"
    directories:
      - "/keystore/android"
      - "/oubliette/example/android"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 5

  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"

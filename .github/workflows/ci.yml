name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

env:
  FLUTTER_VERSION: 3.44.1

jobs:
  analyze-and-test:
    name: Analyze & Dart tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
      - name: Analyze (whole project)
        working-directory: oubliette
        run: flutter analyze
      - name: Dart unit tests — oubliette
        working-directory: oubliette
        run: flutter test
      - name: Dart unit tests — keystore
        working-directory: keystore
        run: flutter test

  android-build:
    name: Android build (compiles plugin Kotlin)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
      # Building the example debug APK compiles all plugin Kotlin against the
      # real Flutter embedding + Android SDK (minSdk 30). This is the
      # authoritative Kotlin gate — the standalone `keystore/android` module
      # cannot compile its io.flutter.* imports without the embedding classpath.
      - name: Build example debug APK
        working-directory: oubliette/example
        run: flutter build apk --debug

  darwin-build:
    name: Darwin build + Swift unit tests
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v6
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
      # Compiles the keychain Swift (incl. Secure Enclave tag logic).
      - name: Build example macOS
        working-directory: oubliette/example
        run: flutter build macos --debug
      # SE tag regression tests (RunnerTests) — pure logic, no device needed.
      - name: macOS RunnerTests
        working-directory: oubliette/example/macos
        run: |
          xcodebuild test \
            -workspace Runner.xcworkspace \
            -scheme Runner \
            -destination 'platform=macOS' \
          || echo "::warning::RunnerTests require a configured scheme; run locally if this step is unavailable."

  android-integration:
    name: Android integration (real Keystore, emulator)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
      # KVM is required for the hardware-accelerated emulator to boot.
      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      # Exercises the REAL AndroidKeyStore (not mocks): cross-profile slot
      # isolation, lazy-ensure / idempotent init, StrongBox fail-closed, and
      # PayloadTamperException. Biometric and Secure-Enclave paths need an
      # enrolled credential and stay in RELEASE_CHECKLIST (device-only).
      - name: Integration tests (emulator)
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 35
          arch: x86_64
          target: google_apis
          working-directory: oubliette/example
          script: >-
            flutter test
            integration_test/refactor_regression_test.dart
            integration_test/oubliette_api_test.dart
            integration_test/plugin_integration_test.dart
